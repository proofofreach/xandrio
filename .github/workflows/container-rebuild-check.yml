name: Scheduled pinned-base rebuild and scan

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-and-scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Rebuild pinned base with current Debian packages
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          pull: true
          push: false
          tags: xandrio:scheduled-${{ matrix.arch }}
          build-args: |
            VERSION=scheduled-check
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
      - name: Execute rebuilt image
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --detach --name xandrio-scheduled --platform "$PLATFORM" \
            --publish 127.0.0.1:8181:8181 "xandrio:scheduled-${ARCH}"
          trap 'docker logs xandrio-scheduled; docker rm --force xandrio-scheduled' EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8181/health | grep --quiet '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Scan rebuilt image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: xandrio:scheduled-${{ matrix.arch }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
